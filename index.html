<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artı Destek - Online İşlemler</title>
    <link rel="stylesheet" href="styles.css?v=20260515-1445" />
    <link rel="stylesheet" href="portal-hotfix.css?v=20260515-1445" />
  </head>
  <body>
    <section class="login-page" id="loginPage">
      <div class="login-box">
        <div class="login-logo">
          <img src="assets/arti-destek-logo.png?v=20260515-1445" alt="Artı Destek" />
          <b>ONLINE</b>
        </div>
        <form class="login-card" id="loginForm">
          <h1>Portal Girişi</h1>
          <label>
            E-posta veya kullanıcı adı
            <input id="loginUsername" type="text" autocomplete="username" required />
          </label>
          <label>
            Şifre
            <input id="loginPassword" type="password" autocomplete="current-password" required />
          </label>
          <p class="login-error" id="loginError" role="alert"></p>
          <button class="btn btn-green" type="submit">Giriş Yap</button>
          <small>Canlı giriş için Supabase üzerinde açılan e-posta ve şifre kullanılır.</small>
        </form>
      </div>
    </section>

    <div class="admin-shell" id="appShell" hidden>
      <header class="main-header">
        <a class="brand-logo" href="#panel" aria-label="Artı Destek">
          <img src="assets/arti-destek-logo.png?v=20260515-1445" alt="Artı Destek" />
        </a>
        <nav class="topbar" aria-label="Üst menü">
          <button class="hamburger" id="sidebarToggle" type="button" title="Menüyü aç/kapat" aria-label="Menüyü aç/kapat">
            <span data-icon="menu"></span>
          </button>
          <div class="topbar-user">
            <div class="language-switch" aria-label="Dil seçimi">
              <button class="active" type="button" data-lang="tr">TR</button>
              <button type="button" data-lang="en">ENG</button>
            </div>
            <span class="avatar"></span>
            <strong id="currentUserName">Admin</strong>
            <button class="logout-button" id="logoutButton" type="button">Çıkış</button>
          </div>
        </nav>
      </header>

      <aside class="sidebar" id="sidebar">
        <nav class="side-nav" id="sideNav" aria-label="Panel menüsü"></nav>
      </aside>

      <main class="content">
        <section class="page-head">
          <h1 id="pageTitle">Online İşlemler</h1>
          <ol class="breadcrumb" id="breadcrumb"></ol>
        </section>

        <section id="pageContent"></section>
      </main>
    </div>

    <dialog class="modal" id="recordDialog">
      <form class="modal-card" id="recordForm">
        <input id="moduleIdInput" type="hidden" />
        <input id="recordIdInput" type="hidden" />
        <div class="modal-header">
          <h2 id="dialogTitle">Kayıt</h2>
          <button class="icon-button" id="dialogCloseButton" type="button" title="Kapat" aria-label="Kapat">
            <span data-icon="x"></span>
          </button>
        </div>
        <div class="form-grid" id="formGrid"></div>
        <div class="modal-actions">
          <button class="btn btn-light" id="dialogCancelButton" type="button">Vazgeç</button>
          <button class="btn btn-green" type="submit">Kaydet</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal chart-modal" id="chartDialog">
      <section class="modal-card">
        <div class="modal-header">
          <h2 id="chartTitle">Grafik</h2>
          <button class="icon-button" id="chartCloseButton" type="button" title="Kapat" aria-label="Kapat">
            <span data-icon="x"></span>
          </button>
        </div>
        <div class="chart-content" id="chartContent"></div>
      </section>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=20260515-1445"></script>
    <script src="app.js?v=20260515-1445"></script>
    <script src="portal-hotfix.js?v=20260515-1445"></script>
  </body>
</html>
